:root{color-scheme:light;--red:#9a191b;--cream:#fff8ec;--chrome:#9a191b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--chrome);font-family:OnestLoader,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{height:100vh;height:100dvh;overflow:hidden}.chrome-edge{position:fixed;left:0;right:0;z-index:200;pointer-events:none;background:var(--chrome)}.chrome-top{top:0;height:env(safe-area-inset-top,0px)}.chrome-bottom{bottom:0;height:env(safe-area-inset-bottom,0px)}.app{width:100%;height:100%;background:var(--chrome);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}iframe{display:block;width:100%;height:100%;border:0;background:var(--cream);opacity:1;pointer-events:none}body.app-ready iframe{opacity:1;pointer-events:auto}
.splash{position:fixed;inset:0;z-index:100;overflow:hidden;isolation:isolate;background:var(--red);color:var(--cream);opacity:1;transition:opacity .5s ease}.splash.leaving .welcome-center{transition:opacity .22s ease!important;opacity:0!important}.splash.done{opacity:0;pointer-events:none}.splash[hidden],[hidden]{display:none!important}
.heart-bloom{position:absolute;left:50%;top:50%;width:100vmax;height:100vmax;transform:translate(-50%,-50%) scale(.078);transform-origin:center;will-change:transform;pointer-events:none;opacity:1;transition:transform 1.1s cubic-bezier(.2,.7,.2,1),opacity .35s ease .75s}.heart-bloom path{fill:var(--cream)}.revealed .heart-bloom{transform:translate(-50%,-50%) scale(.312);opacity:0}
.welcome-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(42px + env(safe-area-inset-top)) 24px calc(42px + env(safe-area-inset-bottom));text-align:center;z-index:2;opacity:0;transform:translateY(12px);transition:opacity .45s ease .8s,transform .55s cubic-bezier(.2,.8,.2,1) .8s}.revealed .welcome-center{opacity:1;transform:none}.splash-brand{display:block;width:min(79vw,370px);height:auto}.splash-brand path,.splash-heart path{fill:var(--cream)}.welcome-message{font-size:clamp(19px,5vw,27px);font-weight:400;line-height:1.4;letter-spacing:.055em;margin:28px 0 0}.welcome-heart{width:19px;height:29px;margin-top:46px;animation:soft-heart 2.6s ease-in-out infinite}.welcome-heart svg{display:block;width:100%;height:100%}.welcome-status{max-width:300px;margin:24px 0 0;font-size:13px;line-height:1.6;color:var(--cream);opacity:.8}.welcome-status:empty{display:none}.retry{margin-top:16px;min-height:48px;padding:12px 22px;border:1px solid var(--red);border-radius:100px;background:var(--cream);color:var(--red);font:inherit;font-size:15px;cursor:pointer}.retry:focus-visible{outline:2px solid var(--red);outline-offset:4px}
@keyframes soft-heart{0%,100%{transform:scale(1)}50%{transform:scale(.88)}}
@media(max-height:480px){.splash-brand{width:min(62vw,260px)}.welcome-message{font-size:18px;margin-top:18px}.welcome-heart{height:29.9px;margin-top:16px}}

  <script>
    let frame = document.getElementById('appFrame');
    const splash = document.getElementById('splash');
    const status = document.getElementById('splashStatus');
    const retry = document.getElementById('retry');

    const bootHelp=document.getElementById('bootHelp');
    const bootHelpText=document.getElementById('bootHelpText');
    document.getElementById('directEntry').href=frame.dataset.src;
    document.getElementById('dismissBootHelp').addEventListener('click',()=>{bootHelp.hidden=true;});
    let windowShown=false;
    let slowTimer;
    let ready = false;
    let appTheme = '#9a191b';
    function applyChrome(color) {
      document.documentElement.style.setProperty('--chrome', color);
      document.documentElement.style.backgroundColor = color;
      document.body.style.backgroundColor = color;
      const oldTheme = document.querySelector('meta[name="theme-color"]');
      const newTheme = document.createElement('meta');
      newTheme.name = 'theme-color'; newTheme.content = color;
      if(oldTheme)oldTheme.replaceWith(newTheme);else document.head.appendChild(newTheme);
    }
    let revealTimer, exitTimer, hideTimer;
    let introStarted = performance.now();
    let hapticSent = false;
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    function welcomeHaptic() {
      if (hapticSent || splash.hidden || document.hidden || reducedMotion) return;
      if (typeof navigator.vibrate !== 'function' || !navigator.userActivation?.hasBeenActive) return;
      try { hapticSent = navigator.vibrate(16) === true; } catch (_) {}
    }
    splash.addEventListener('pointerdown', welcomeHaptic, {passive:true});

    // Событие iframe.load означает готовность оболочки Google,
    // а не формы входа. Ждём явное сообщение от приложения.
    // The short brand sequence runs in parallel with Google loading.
    // Fast responses finish the sequence; slow responses add no extra hold.
    const INTRO_DURATION_MS=1800;
    function finishLoading() {
      if(ready)return;
      ready=true;bootHelp.hidden=true;retry.hidden=true;status.textContent='';
      clearTimeout(slowTimer);
      if(windowShown){applyChrome(appTheme);return;}
      exitTimer=setTimeout(()=>{
        splash.style.background='#9a191b';splash.classList.add('leaving');
        hideTimer=setTimeout(()=>{
          applyChrome(appTheme);document.body.classList.add('app-ready');splash.hidden=true;
        },reducedMotion?0:220);
      },Math.max(0,(reducedMotion?0:INTRO_DURATION_MS)-(performance.now()-introStarted)));
    }

    // Долговечная очередь на основном домене PWA: не зависит от домена iframe Google.
    let auditStorageDb;
    function openAuditStorage() {
      if (!auditStorageDb) auditStorageDb = new Promise((resolve,reject) => {
        const request=indexedDB.open('pyanseshka-audits-v38',1);
        request.onupgradeneeded=()=>request.result.createObjectStore('records',{keyPath:'key'});
        request.onsuccess=()=>resolve(request.result);
        request.onerror=()=>{auditStorageDb=null;reject(new Error('Не удалось открыть память приложения.'));};
      });
      return auditStorageDb;
    }
    async function handleAuditStorage(event) {
      const d=event.data,response={type:'pyanseshka:audits:response',requestId:d.requestId,ok:false};
      if(typeof d.requestId!=='string'||d.requestId.length>100||typeof d.owner!=='string'||!d.owner||d.owner.length>100)return;
      if(!['ping','list','get','put','delete'].includes(d.operation))return;
      try {
        const db=await openAuditStorage();
        if(d.operation!=='ping') {
          if(d.operation!=='list'&&(typeof d.key!=='string'||!d.key||d.key.length>120))throw new Error('Некорректный ключ проверки.');
          if(d.operation==='put'&&(!d.value||d.value.owner!==d.owner||d.value.key!==d.owner+'|'+d.key||d.value.requestId!==d.key))throw new Error('Некорректная запись проверки.');
          response.value=await new Promise((resolve,reject)=>{
            let result;const tx=db.transaction('records',['put','delete'].includes(d.operation)?'readwrite':'readonly'),store=tx.objectStore('records');let request;
            if(d.operation==='put')request=store.put(d.value);else if(d.operation==='delete')request=store.delete(d.owner+'|'+d.key);else if(d.operation==='get')request=store.get(d.owner+'|'+d.key);else request=store.getAll();
            request.onsuccess=()=>{result=request.result;if(d.operation==='list')result=result.filter(r=>r.owner===d.owner);};
            tx.oncomplete=()=>resolve(result);tx.onerror=tx.onabort=()=>reject(new Error('Не удалось сохранить проверку на устройстве. Освободите память и повторите.'));
          });
        }
        response.ok=true;
        if(d.operation==='put'&&navigator.storage?.persist)navigator.storage.persist().catch(()=>{});
      } catch(error) {response.error=error.message;}
      event.source.postMessage(response,event.origin);
    }

    window.addEventListener('message', event => {
      let host;

      try {
        host = new URL(event.origin).hostname;
      } catch (_) {
        return;
      }

      const trusted =
        event.origin.startsWith('https://') &&
        (
          host === 'script.google.com' ||
          host === 'script.googleusercontent.com' ||
          host.endsWith('.googleusercontent.com')
        );

      if(trusted&&event.source&&event.data?.type==='pyanseshka:audits:request'){handleAuditStorage(event);return;}
      // Храним только токен на основном домене приложения.
      // Это не зависит от доступа iframe Google к стороннему хранилищу.
      if (trusted && event.source && event.data && event.data.type === 'pyanseshka:session:request') {
        const data = event.data;
        if (typeof data.requestId !== 'string' || data.requestId.length > 100) return;
        const response = {type: 'pyanseshka:session:response', requestId: data.requestId, ok: false};
        try {
          const key = 'pyanseshka.session.v1';
          if (data.operation === 'get') {
            response.token = localStorage.getItem(key) || '';
          } else if (data.operation === 'set' && /^[a-f0-9]{64}$/.test(String(data.token || ''))) {
            localStorage.setItem(key, data.token);
          } else if (data.operation === 'clear') {
            localStorage.removeItem(key);
          } else {
            return;
          }
          response.ok = true;
        } catch (_) {}
        event.source.postMessage(response, event.origin);
        return;
      }

      if (trusted && event.data && event.data.type === 'pyanseshka:theme') {
        if(event.data.bootId&&event.data.bootId!==bootId)return;
        const color = event.data.color;
        if (color === '#9a191b' || color === '#f5f2ee' || color === '#fff8ec') {
          appTheme = color;
          frame.style.backgroundColor = color;
          if (document.body.classList.contains('app-ready')) applyChrome(color);
        }
        return;
      }
      if(!trusted||!event.source||!event.data)return;
      const data=event.data,isCurrent=data.bootId===bootId,legacy=!data.bootId&&bootAttempt===1;
      if(data.type==='pyanseshka:boot:hello'&&isCurrent){bootPeer=event.source;bootPeerOrigin=event.origin;if(!ready)bootPeer.postMessage({type:'pyanseshka:boot:probe',bootId},bootPeerOrigin);return;}
      if(data.type!=='pyanseshka:ready'||(!isCurrent&&!legacy))return;
      bootPeer=event.source;bootPeerOrigin=event.origin;
      event.source.postMessage({type:'pyanseshka:ready:ack',bootId},event.origin);
      finishLoading();
    });

    let bootAttempt=0,bootId='',bootPeer=null,bootPeerOrigin='',bootRetryDue=false;
    const BOOT_WAIT_MS=12000;
    function bootNonce(){return Date.now().toString(36)+'-'+(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2));}
    function bootBlocked(){return navigator.onLine===false||document.hidden;}
    // Readiness and visibility are separate: a missing message must not hide
    // a usable form (or Google's own error). Never reload a slow frame on a timer.
    function showAppWindow(){
      if(ready||windowShown)return;
      windowShown=true;
      clearTimeout(revealTimer);clearTimeout(exitTimer);clearTimeout(hideTimer);
      applyChrome(appTheme);document.body.classList.add('app-ready');splash.hidden=true;
      bootHelpText.textContent=navigator.onLine===false
        ?'Нет соединения. Окно продолжит загружаться после подключения.'
        :'Показываем окно приложения. Если вход не появился, откройте его напрямую.';
      bootHelp.hidden=false;
    }
    function waitForBoot(){
      clearTimeout(slowTimer);
      slowTimer=setTimeout(()=>{
        if(ready)return;
        if(document.hidden){bootRetryDue=true;return;}
        showAppWindow();
      },BOOT_WAIT_MS);
    }
    function launchBootAttempt(){
      if(ready)return;
      if(bootBlocked()){bootRetryDue=true;status.textContent=navigator.onLine===false?'Нет интернета. Загрузка продолжится после подключения.':'Загрузка продолжится при возвращении в приложение.';retry.hidden=false;return;}
      bootRetryDue=false;bootAttempt++;bootId=bootNonce();bootPeer=null;bootPeerOrigin='';
      const next=frame.cloneNode(false),url=new URL(frame.dataset.src);url.searchParams.set('_pyanseshka_boot',bootId);
      next.src=url.href;frame.replaceWith(next);frame=next;retry.hidden=true;waitForBoot();
    }
    function startLoading(){
      ready=false;windowShown=false;bootHelp.hidden=true;bootAttempt=0;bootId='';bootPeer=null;bootRetryDue=false;
      document.body.classList.remove('app-ready');appTheme='#9a191b';applyChrome('#9a191b');splash.hidden=false;splash.style.background='';
      splash.querySelector('.welcome-center').style.opacity='';splash.classList.remove('done','is-slow','revealed','leaving');
      clearTimeout(revealTimer);clearTimeout(exitTimer);clearTimeout(hideTimer);clearTimeout(slowTimer);introStarted=performance.now();hapticSent=false;
      revealTimer=setTimeout(()=>{splash.classList.add('revealed');welcomeHaptic();},reducedMotion?0:40);
      status.textContent='';retry.hidden=true;launchBootAttempt();
    }
    function resumeBoot(){
      if(ready||bootBlocked())return;
      if(bootAttempt===0){launchBootAttempt();return;}
      if(bootPeer)bootPeer.postMessage({type:'pyanseshka:boot:probe',bootId},bootPeerOrigin);
      // Keep the existing frame and any form data when returning from background.
      if(bootRetryDue){bootRetryDue=false;showAppWindow();}
    }
    window.addEventListener('online',resumeBoot);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)resumeBoot();});
    retry.addEventListener('click',startLoading);
    startLoading();
  </script>
</body>
</html>
