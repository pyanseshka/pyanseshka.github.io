:root{color-scheme:light;--red:#9a191b;--cream:#fff8ec;--chrome:#9a191b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--chrome);font-family:OnestLoader,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{height:100vh;height:100dvh;overflow:hidden}.chrome-edge{position:fixed;left:0;right:0;z-index:200;pointer-events:none;background:var(--chrome)}.chrome-top{top:0;height:env(safe-area-inset-top,0px)}.chrome-bottom{bottom:0;height:env(safe-area-inset-bottom,0px)}.app{width:100%;height:100%;background:var(--chrome);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}iframe{display:block;width:100%;height:100%;border:0;background:var(--cream);opacity:0;pointer-events:none}body.app-ready iframe{opacity:1;pointer-events:auto}
.splash{position:fixed;inset:0;z-index:100;overflow:hidden;isolation:isolate;background:var(--red);color:var(--cream);opacity:1;transition:opacity .5s ease}.splash.leaving .welcome-center{transition:opacity .35s ease!important;opacity:0!important}.splash.done{opacity:0;pointer-events:none}.splash[hidden],[hidden]{display:none!important}
.heart-bloom{position:absolute;left:50%;top:50%;width:100vmax;height:100vmax;transform:translate(-50%,-50%) scale(.078);transform-origin:center;will-change:transform;pointer-events:none;opacity:1;transition:transform 1.5s cubic-bezier(.2,.7,.2,1),opacity .55s ease .8s}.heart-bloom path{fill:var(--cream)}.revealed .heart-bloom{transform:translate(-50%,-50%) scale(.312);opacity:0}
.welcome-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(42px + env(safe-area-inset-top)) 24px calc(42px + env(safe-area-inset-bottom));text-align:center;z-index:2;opacity:0;transform:translateY(12px);transition:opacity .75s ease 1.1s,transform .9s cubic-bezier(.2,.8,.2,1) 1.1s}.revealed .welcome-center{opacity:1;transform:none}.splash-brand{display:block;width:min(79vw,370px);height:auto}.splash-brand path,.splash-heart path{fill:var(--cream)}.welcome-message{font-size:clamp(19px,5vw,27px);font-weight:400;line-height:1.4;letter-spacing:.055em;margin:28px 0 0}.welcome-heart{width:19px;height:29px;margin-top:46px;animation:soft-heart 2.6s ease-in-out infinite}.welcome-heart svg{display:block;width:100%;height:100%}.welcome-status{max-width:300px;margin:24px 0 0;font-size:13px;line-height:1.6;color:var(--cream);opacity:.8}.welcome-status:empty{display:none}.retry{margin-top:16px;min-height:48px;padding:12px 22px;border:1px solid var(--red);border-radius:100px;background:var(--cream);color:var(--red);font:inherit;font-size:15px;cursor:pointer}.retry:focus-visible{outline:2px solid var(--red);outline-offset:4px}
@keyframes soft-heart{0%,100%{transform:scale(1)}50%{transform:scale(.88)}}
@media(max-height:480px){.splash-brand{width:min(62vw,260px)}.welcome-message{font-size:18px;margin-top:18px}.welcome-heart{height:29.9px;margin-top:16px}}
@media(prefers-reduced-motion:reduce){.heart-bloom,.welcome-center,.splash{transition:none}.heart-bloom{will-change:auto}.welcome-heart{animation:none}.welcome-center{transform:none}}
</style>

  <main class="app">
    <iframe
      id="appFrame"
      title="Рабочая среда Пянсешка"
      data-src="https://script.google.com/macros/s/AKfycbzMi9OtrEJZU7Uw1SxjLpPYdL664MANvYbwcFLZAMXzdOLmiJloMQxT1KR6Wl35-7Rp/exec"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads"
    ></iframe>
  </main>

  <script>
    const frame = document.getElementById('appFrame');
    const splash = document.getElementById('splash');
    const status = document.getElementById('splashStatus');
    const retry = document.getElementById('retry');

    let slowTimer;
    let ready = false;
    let appTheme = '#9a191b';
    function applyChrome(color) {
      document.documentElement.style.setProperty('--chrome', color);
      document.documentElement.style.backgroundColor = color;
      document.body.style.backgroundColor = color;
      const oldTheme = document.querySelector('meta[name="theme-color"]');
      const newTheme = document.createElement('meta');
      newTheme.name = 'theme-color'; newTheme.content = color;
      oldTheme.replaceWith(newTheme);
    }
    let revealTimer, exitTimer, hideTimer;
    let introStarted = performance.now();
    let hapticSent = false;
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    function welcomeHaptic() {
      if (hapticSent || splash.hidden || document.hidden || reducedMotion) return;
      if (typeof navigator.vibrate !== 'function' || !navigator.userActivation?.hasBeenActive) return;
      try { hapticSent = navigator.vibrate(16) === true; } catch (_) {}
    }
    splash.addEventListener('pointerdown', welcomeHaptic, {passive:true});

    // Событие iframe.load означает готовность оболочки Google,
    // а не формы входа. Ждём явное сообщение от приложения.
    function finishLoading() {
      if (ready) return;
      ready = true;
      clearTimeout(slowTimer);
      retry.hidden = true;
      status.textContent = '';
      exitTimer = setTimeout(() => {
        // Fade the welcome into its own background before revealing the form.
        splash.style.background = '#9a191b';
        splash.classList.add('leaving');
        requestAnimationFrame(() => {
          hideTimer = setTimeout(() => {
            applyChrome(appTheme);
            document.body.classList.add('app-ready');
            splash.hidden = true;
          }, reducedMotion ? 0 : 420);
        });
      }, Math.max(0, (reducedMotion ? 1500 : 3600) - (performance.now() - introStarted)));
    }

    window.addEventListener('message', event => {
      let host;

      try {
        host = new URL(event.origin).hostname;
      } catch (_) {
        return;
      }

      const trusted =
        event.origin.startsWith('https://') &&
        (
          host === 'script.google.com' ||
          host === 'script.googleusercontent.com' ||
          host.endsWith('.googleusercontent.com')
        );

      // Храним только токен на основном домене приложения.
      // Это не зависит от доступа iframe Google к стороннему хранилищу.
      if (trusted && event.source && event.data && event.data.type === 'pyanseshka:session:request') {
        const data = event.data;
        if (typeof data.requestId !== 'string' || data.requestId.length > 100) return;
        const response = {type: 'pyanseshka:session:response', requestId: data.requestId, ok: false};
        try {
          const key = 'pyanseshka.session.v1';
          if (data.operation === 'get') {
            response.token = localStorage.getItem(key) || '';
          } else if (data.operation === 'set' && /^[a-f0-9]{64}$/.test(String(data.token || ''))) {
            localStorage.setItem(key, data.token);
          } else if (data.operation === 'clear') {
            localStorage.removeItem(key);
          } else {
            return;
          }
          response.ok = true;
        } catch (_) {}
        event.source.postMessage(response, event.origin);
        return;
      }

      if (trusted && event.data && event.data.type === 'pyanseshka:theme') {
        const color = event.data.color;
        if (color === '#9a191b' || color === '#f5f2ee' || color === '#fff8ec') {
          appTheme = color;
          frame.style.backgroundColor = color;
          if (document.body.classList.contains('app-ready')) applyChrome(color);
        }
        return;
      }
      if (
        !trusted ||
        !event.data ||
        event.data.type !== 'pyanseshka:ready' ||
        ready
      ) {
        return;
      }

      finishLoading();
    });

    function startLoading() {
      ready = false;
      document.body.classList.remove('app-ready');
      appTheme = '#9a191b';
      applyChrome('#9a191b');
      splash.hidden = false;
      splash.style.background = '';
      splash.querySelector('.welcome-center').style.opacity = '';
      splash.classList.remove('done', 'is-slow', 'revealed', 'leaving');
      clearTimeout(revealTimer); clearTimeout(exitTimer); clearTimeout(hideTimer);
      introStarted = performance.now(); hapticSent = false;
      requestAnimationFrame(() => { revealTimer = setTimeout(() => {
        splash.classList.add('revealed'); welcomeHaptic();
      }, reducedMotion ? 0 : 70); });
      clearTimeout(slowTimer);
      retry.hidden = true;
      status.textContent = '';
      frame.src = frame.dataset.src;

      slowTimer = setTimeout(() => {
        if (ready) return;

        status.textContent =
          'Загрузка занимает больше времени. Проверьте соединение и попробуйте ещё раз.';

        
        retry.hidden = false;
      }, 30000);
    }

    retry.addEventListener('click', startLoading);
    startLoading();
  </script>
