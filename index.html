    .splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      box-sizing: border-box;
      background: #9a191b;
      color: #fff8ec;
      text-align: center;
      opacity: 1;
      transition: opacity .24s ease;
    }
    .splash.done { opacity: 0; pointer-events: none; }
    .splash-brand {
      position: absolute;
      display: block;
      width: 70%;
      max-width: 360px;
      height: auto;
      top: max(12%, calc(env(safe-area-inset-top) + 24px));
      left: 50%;
      transform: translateX(-50%);
    }
    .loading-group {
      position: absolute;
      z-index: 2;
      top: 40%;
      left: 50%;
      transform: translateX(-50%);
      width: 86%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .heart-motion {
      width: clamp(30px, 10vw, 49px);
      transform-origin: 50% 100%;
      animation: heart-breathe 1.8s cubic-bezier(.45, 0, .55, 1) infinite;
      will-change: transform;
    }
    .splash-heart { display: block; width: 100%; height: auto; }
    .splash-status {
      margin: 23px 0 0;
      max-width: 320px;
      font-family: OnestLoader, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      font-size: clamp(11px, 2.7vw, 13px);
      font-weight: 400;
      color: #fff8ec;
      line-height: 1.6;
    }
    .splash-mascot {
      position: absolute;
      z-index: 1;
      display: block;
      bottom: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 86%;
      max-width: 440px;
      height: auto;
      pointer-events: none;
    }
    .retry {
      margin-top: 18px;
      min-height: 48px;
      padding: 12px 24px;
      border: 1px solid #fff8ec;
      border-radius: 14px;
      background: #fff8ec;
      color: #9a191b;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .retry:focus-visible { outline: 2px solid #fff8ec; outline-offset: 4px; }
    .splash.is-slow .splash-mascot { opacity: .25; }
    [hidden] { display: none !important; }
    @keyframes heart-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(.5); }
    }
    @media (max-height: 650px) {
      .splash.is-slow .loading-group { top: 30%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash { transition: none; }
      .heart-motion { animation: none; will-change: auto; }
    }
  </style>
</head>

  <main class="app">
    <iframe
      id="appFrame"
      title="Рабочая среда Пянсешка"
      data-src="https://script.google.com/macros/s/AKfycbzMi9OtrEJZU7Uw1SxjLpPYdL664MANvYbwcFLZAMXzdOLmiJloMQxT1KR6Wl35-7Rp/exec"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads"
    ></iframe>
  </main>

  <script>
    const frame = document.getElementById('appFrame');
    const splash = document.getElementById('splash');
    const status = document.getElementById('splashStatus');
    const retry = document.getElementById('retry');

    let slowTimer;
    let ready = false;

    function finishLoading() {
      if (ready) return;

      ready = true;
      clearTimeout(slowTimer);
      splash.classList.add('done');

      setTimeout(() => {
        splash.hidden = true;
      }, 250);
    }

    frame.addEventListener('load', () => {
      requestAnimationFrame(() => {
        requestAnimationFrame(finishLoading);
      });
    });

    window.addEventListener('message', event => {
      let host;

      try {
        host = new URL(event.origin).hostname;
      } catch (_) {
        return;
      }

      const trusted =
        event.origin.startsWith('https://') &&
        (
          host === 'script.google.com' ||
          host === 'script.googleusercontent.com' ||
          host.endsWith('.googleusercontent.com')
        );

      if (trusted && event.data && event.data.type === 'pyanseshka:theme') {
        const color = event.data.color;
        if (color === '#9a191b' || color === '#f5f2ee') {
          document.documentElement.style.backgroundColor = color;
          document.body.style.backgroundColor = color;
        }
        return;
      }
      if (
        !trusted ||
        !event.data ||
        event.data.type !== 'pyanseshka:ready' ||
        ready
      ) {
        return;
      }

      finishLoading();
    });

    function startLoading() {
      ready = false;
      splash.classList.remove('is-slow');
      clearTimeout(slowTimer);
      retry.hidden = true;
      status.textContent = 'Загружаем приложение...';
      frame.src = frame.dataset.src;

      slowTimer = setTimeout(() => {
        if (ready) return;

        status.textContent =
          'Загрузка занимает больше времени. Проверьте соединение и попробуйте ещё раз.';

        splash.classList.add('is-slow');
        retry.hidden = false;
      }, 30000);
    }

    retry.addEventListener('click', startLoading);
    startLoading();
  </script>
